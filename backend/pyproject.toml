[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI Depends()/Query() in argument defaults

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]
"app/seed.py" = ["E501"]  # long seed text

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "freezegun.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85 --junitxml=junit.xml"
filterwarnings = ["error::DeprecationWarning:app.*"]
