# Development overrides: hot reload for backend (uvicorn --reload) and frontend (Vite).
services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "${DEV_FRONTEND_PORT:-5173}:5173"

volumes:
  frontend_node_modules:
